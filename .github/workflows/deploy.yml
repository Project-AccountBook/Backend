name: Deploy to OCI
on:
  push:
    branches: [ feat/ACC-126-ci-cd ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Gradle
        run: ./gradlew clean build -x test
      - name: Send to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "build/libs/AccountBookForMoms-0.0.1-SNAPSHOT.jar,docker-compose.yml,docker/"
          target: "/home/ubuntu/app"
          strip_components: 2
      - name: Create secret file
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cat << 'EOF' > /home/ubuntu/app/application-secret.yml
            ${{ secrets.APPLICATION_SECRET }}
            EOF
      - name: Run on Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/app && \
            sudo docker compose up -d --build && \
            pgrep -f 'AccountBookForMoms' | xargs kill -15 || true && \
            sleep 5 && \
            nohup java -jar AccountBookForMoms-0.0.1-SNAPSHOT.jar > nohup.out 2>&1 &
            disown