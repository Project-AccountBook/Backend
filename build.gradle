plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.2.2' // 🔥 가장 안정적인 버전으로 고정
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.chaewookim'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral() // ⭐️ 이게 없으면 라이브러리 못 받아옴 (확인 필수)
}

dependencies {
    // 1. 스프링 부트 필수
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 2. DB (MySQL)
    runtimeOnly 'com.mysql:mysql-connector-j'

    // 3. 롬복 (버전 명시 안 해도 플러그인이 관리해줌)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 4. JWT (jjwt 0.11.5 세트)
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // 5. Swagger (SpringDoc)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'

    // 6. 테스트
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'

    // 7. Redis
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // 8. OAuth2 Client (소셜 로그인)
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // 9. Elasticsearch (게시판 검색 — nori 분석기)
    implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = '0.8.12'
}

def jacocoExcludes = [
        '**/AccountBookForMomsApplication*',
        '**/dto/**',
        '**/entity/**',
        '**/enums/**',
        '**/error/**',
        '**/global/config/**',
        '**/global/common/**',
        '**/global/event/**',
        '**/domain/grouppruchase/domain/**',
]

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, excludes: jacocoExcludes)
        }))
    }
}

// 점진 적용: 테스트가 갖춰진 도메인만 검증 대상. 새 도메인 테스트 추가 시 includes에 합류시킨다.
def jacocoVerificationIncludes = [
        '**/domain/board/application/**',
]

jacocoTestCoverageVerification {
    dependsOn test
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, includes: jacocoVerificationIncludes, excludes: jacocoExcludes)
        }))
    }
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.8
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.8
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
