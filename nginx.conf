events {
    worker_connections 1032;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream backend {
        server joint-living-backend:8000;
    }

    server {
        listen 80;
        server_name api.moneydiary.cloud;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name api.moneydiary.cloud;

        ssl_certificate /etc/letsencrypt/live/api.moneydiary.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.moneydiary.cloud/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            set $backend_upstream http://joint-living-backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}