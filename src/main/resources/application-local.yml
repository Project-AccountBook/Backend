spring:
  datasource:
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://localhost:5174"
      - "capacitor://localhost"
      - "http://localhost"
  mail:
    dev-log-code: true
