server:
  port: 8000

spring:
  application:
    name: AccountBookForMoms

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

  config:
    import:
      - classpath:/application-secret.yml
