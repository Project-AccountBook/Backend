server:
  port: 8000
  forward-headers-strategy: native
  tomcat:
    threads:
      max: 30
      min-spare: 5

spring:
  application:
    name: AccountBookForMoms

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 100

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

  data:
    web:
      pageable:
        max-page-size: 100

  config:
    import:
      - optional:file:/app/application-secret.yml
      - optional:classpath:/application-secret.yml

  mail:
    host: smtp.resend.com
    port: 587
    username: resend
    password: ${RESEND_API_KEY:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  cors:
    allowed-origins:
      - "http://localhost:5173"
      - "http://127.0.0.1:5173"
      - "http://localhost:5174"
      - "http://127.0.0.1:5174"
      - "https://frontend-sand-nu-34.vercel.app"
      - "https://moneydiary.cloud"
      - "https://admin-frontend-rho-five.vercel.app"
      - "capacitor://localhost"
      - "http://localhost"
      - "https://localhost"
  mail:
    from: ${MAIL_FROM:noreply@moneydiary.cloud}
    dev-log-code: ${MAIL_DEV_LOG_CODE:false}
  oauth2:
    authorized-redirect-uri: ${FRONTEND_REDIRECT_URL:com.jointliving.app://oauth2/redirect}
    authorized-redirect-uri-web: ${FRONTEND_REDIRECT_URL_WEB:http://localhost:5173/oauth2/redirect}
    admin-redirect-uri: ${ADMIN_REDIRECT_URL:https://admin-frontend-rho-five.vercel.app/oauth2/redirect}
    admin-redirect-uri-local: ${ADMIN_REDIRECT_URL_LOCAL:http://localhost:5174/oauth2/redirect}
    # 로그인 완료 후 리다이렉트 가능한 URI 화이트리스트. 이 목록에 없는 값이 들어오면
    # `authorized-redirect-uri` 기본값으로 fallback (open redirect 방어).
    # 프로덕션 값은 배포 파이프라인에서 환경변수로 override.
    authorized-redirect-uris:
      - http://localhost:5173/oauth2/redirect
      - http://127.0.0.1:5173/oauth2/redirect
      - http://localhost:5174/oauth2/redirect
      - http://127.0.0.1:5174/oauth2/redirect
      - https://frontend-sand-nu-34.vercel.app/oauth2/redirect
      - https://moneydiary.cloud/oauth2/redirect
      - https://admin-frontend-rho-five.vercel.app/oauth2/redirect
      - com.jointliving.app://oauth2/redirect

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}