server:
  port: 8000
  forward-headers-strategy: native
  tomcat:
    threads:
      max: 30
      min-spare: 5

spring:
  application:
    name: AccountBookForMoms

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

  data:
    web:
      pageable:
        max-page-size: 100

  config:
    import:
      - optional:file:/app/application-secret.yml
      - optional:classpath:/application-secret.yml

  mail:
    host: smtp.resend.com
    port: 587
    username: resend
    password: ${RESEND_API_KEY:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  mail:
    from: ${MAIL_FROM:noreply@moneydiary.cloud}
    dev-log-code: ${MAIL_DEV_LOG_CODE:false}
  oauth2:
    authorized-redirect-uri: ${FRONTEND_REDIRECT_URL:http://localhost:5173/oauth2/redirect}

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}