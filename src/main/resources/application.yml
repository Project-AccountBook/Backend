server:
  port: 8000
  forward-headers-strategy: native
  tomcat:
    threads:
      max: 30
      min-spare: 5

spring:
  application:
    name: AccountBookForMoms

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

  config:
    import:
      - optional:file:/app/application-secret.yml
      - optional:classpath:/application-secret.yml

app:
  oauth2:
    authorized-redirect-uri: ${FRONTEND_REDIRECT_URL:http://localhost:5173/oauth2/redirect}

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}