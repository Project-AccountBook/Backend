firebase:
  credentials-path: file:/app/firebase-service-account.json

spring:
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    org.hibernate.SQL: warn

app:
  cors:
    allowed-origins:
      - "https://frontend-sand-nu-34.vercel.app"
      - "https://moneydiary.cloud"
      - "https://admin-frontend-rho-five.vercel.app"
      - "capacitor://localhost"
  mail:
    dev-log-code: false
